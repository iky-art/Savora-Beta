<div class="transaction-card">

<div class="stat-card">

<p>
Pemasukan
</p>

<h3 id="aIncome">
Rp0
</h3>

</div>



<div class="stat-card">

<p>
Pengeluaran
</p>

<h3 id="aExpense">
Rp0
</h3>

</div>



<div class="stat-card">

<p>
Tabungan
</p>

<h3 id="aSaving">
Rp0
</h3>

</div>



</div>



</section>







<section class="card"
style="margin-top:24px">


<h2>
Insight Savora
</h2>


<p id="insight">

Belum ada data transaksi.

</p>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="../assets/js/storage.js"></script>

<script src="../assets/js/theme.js"></script>

<script src="../assets/js/transaction.js"></script>



<script>


const summary =
{

income: Transaction.total("income"),

expense: Transaction.total("expense"),

saving: Transaction.total("saving")

};



function money(value){

return new Intl.NumberFormat(
"id-ID",
{
style:"currency",
currency:"IDR",
maximumFractionDigits:0
}
).format(value);

}



aIncome.textContent =
money(summary.income);


aExpense.textContent =
money(summary.expense);


aSaving.textContent =
money(summary.saving);




new Chart(
document.getElementById("analyticsChart"),
{


type:"bar",


data:{


labels:[

"Pemasukan",
"Pengeluaran",
"Tabungan"

],


datasets:[{

label:"Keuangan",

data:[

summary.income,
summary.expense,
summary.saving

]

}]


},


options:{

responsive:true,

maintainAspectRatio:false

}


});





const insight =
document.getElementById("insight");


if(summary.income > summary.expense){

insight.textContent =
"Keuangan kamu terlihat positif. Pertahankan kebiasaan menabung.";

}

else if(summary.expense > summary.income){

insight.textContent =
"Pengeluaran lebih besar dari pemasukan. Coba evaluasi transaksi.";

}



</script>
