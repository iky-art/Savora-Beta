<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login • Savora</title>

<link rel="icon"
href="../assets/svg/favicon.svg">

<link rel="stylesheet"
href="../assets/css/variables.css">

<link rel="stylesheet"
href="../assets/css/components.css">

<link rel="stylesheet"
href="../assets/css/auth.css">

</head>

<body class="auth">

<!-- ==========================================
     AUTH CARD
========================================== -->

<div class="auth-card">

    <div class="auth-header">

        <img
            src="../assets/svg/logo.svg"
            alt="Savora"
            class="auth-logo">

        <h1>Selamat Datang</h1>

        <p>

            Masuk ke akun Savora
            untuk mengelola keuanganmu.

        </p>

    </div>

    <form
        class="auth-form"
        action="#"
        method="post">

        <!-- Email -->

        <div class="form-group">

            <label for="email">

                Email

            </label>

            <input
                type="email"
                id="email"
                class="form-input"
                placeholder="nama@email.com"
                autocomplete="email"
                required>

        </div>

        <!-- Password -->

        <div class="form-group">

            <label for="password">

                Password

            </label>

            <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required>

        </div>

        <!-- Options -->

        <div class="form-options">

            <label>

                <input
                    type="checkbox">

                Ingat Saya

            </label>

            <a href="#">

                Lupa Password?

            </a>

        </div>

        <!-- Login -->

        <button
            type="submit"
            class="btn btn-primary w-100">

            Masuk

        </button>

    </form>

    <div class="auth-divider">

        <span>atau</span>

    </div>

    <button
        class="btn btn-outline w-100">

        <img
            src="../assets/svg/profile.svg"
            alt="Google"
            width="20"
            height="20">

        Lanjutkan dengan Google

    </button>

    <div class="auth-footer">

        Belum punya akun?

        <a href="register.html">

            Daftar Sekarang

        </a>

    </div>

</div>

<script src="../assets/js/storage.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/login.js"></script>

</body>

</html>
