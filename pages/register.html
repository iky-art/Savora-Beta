<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Daftar • Savora</title>

    <link
        rel="icon"
        href="../assets/svg/favicon.svg">

    <link
        rel="stylesheet"
        href="../assets/css/variables.css">

    <link
        rel="stylesheet"
        href="../assets/css/components.css">

    <link
        rel="stylesheet"
        href="../assets/css/auth.css">

</head>

<body class="auth">

    <div class="auth-card">

        <!-- Header -->

        <div class="auth-header">

            <img
                src="../assets/svg/logo.svg"
                alt="Savora"
                class="auth-logo">

            <h1>Buat Akun</h1>

            <p>

                Mulai perjalanan finansialmu
                bersama Savora.

            </p>

        </div>

        <!-- Form -->

        <form
            class="auth-form"
            action="#"
            method="post">

            <div class="form-group">

                <label for="fullname">

                    Nama Lengkap

                </label>

                <input
                    type="text"
                    id="fullname"
                    class="form-input"
                    placeholder="Masukkan nama lengkap"
                    required>

            </div>

            <div class="form-group">

                <label for="email">

                    Email

                </label>

                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="nama@email.com"
                    required>

            </div>

            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder="Minimal 8 karakter"
                    required>

            </div>

            <div class="form-group">

                <label for="confirmPassword">

                    Konfirmasi Password

                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    class="form-input"
                    placeholder="Ulangi password"
                    required>

            </div>

            <div class="form-options">

                <label>

                    <input
                        type="checkbox"
                        required>

                    Saya menyetujui
                    Syarat & Ketentuan

                </label>

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100">

                Daftar Sekarang

            </button>

        </form>

        <!-- Divider -->

        <div class="auth-divider">

            <span>atau</span>

        </div>

        <!-- Google -->

        <button
            class="btn btn-outline w-100">

            <img
                src="../assets/svg/profile.svg"
                alt=""
                width="20"
                height="20">

            Lanjutkan dengan Google

        </button>

        <!-- Footer -->

        <div class="auth-footer">

            Sudah punya akun?

            <a href="login.html">

                Masuk

            </a>

        </div>

    </div>

</body>

</html>
