<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tabungan - Savora</title>

<link rel="icon" href="../assets/svg/favicon.svg">

<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">

</head>


<body>


<div class="dashboard">


<aside class="sidebar">


<div class="sidebar-logo">

<img src="../assets/svg/logo.svg">

<span class="sidebar-title">
Savora
</span>

</div>



<nav class="sidebar-menu">


<a href="dashboard.html"
class="sidebar-link">

<img src="../assets/svg/wallet.svg" width="24">

<span>
Dashboard
</span>

</a>


<a href="transactions.html"
class="sidebar-link">

<img src="../assets/svg/income.svg" width="24">

<span>
Transaksi
</span>

</a>


<a class="sidebar-link active">

<img src="../assets/svg/saving.svg" width="24">

<span>
Tabungan
</span>

</a>


<a href="goals.html"
class="sidebar-link">

<img src="../assets/svg/goal.svg" width="24">

<span>
Target
</span>

</a>


</nav>


</aside>





<main class="main">


<header class="topbar">


<h1>
Tabungan
</h1>


<button 
class="btn btn-outline"
onclick="Theme.toggle()">

🌙

</button>


</header>





<section class="stats-grid">


<div class="stat-card">

<p class="stat-title">
Total Tabungan
</p>


<h2 id="savingTotal">
Rp0
</h2>


</div>



<div class="stat-card">

<p class="stat-title">
Jumlah Setoran
</p>


<h2 id="savingCount">
0
</h2>


</div>


</section>







<section class="card"
style="margin-top:24px">


<h2>
Tambah Tabungan
</h2>



<form id="savingForm"
class="auth-form">



<div class="form-group">

<label class="form-label">
Nama Tabungan
</label>


<input 
id="savingName"
class="input"
placeholder="Contoh: Laptop Baru"
required>


</div>




<div class="form-group">

<label class="form-label">
Jumlah
</label>


<input
id="savingAmount"
type="number"
class="input"
placeholder="50000"
required>


</div>




<button class="btn btn-primary">

Simpan

</button>


</form>


</section>







<section class="card"
style="margin-top:24px">


<h2>
Riwayat Tabungan
</h2>


<div id="savingList"
class="transaction-list">

</div>


</section>



</main>


</div>







<script src="../assets/js/storage.js"></script>

<script src="../assets/js/theme.js"></script>

<script src="../assets/js/transaction.js"></script>



<script>


const savingForm =
document.getElementById("savingForm");


const savingList =
document.getElementById("savingList");



function renderSaving(){


const data =
Transaction.savings();



document.getElementById("savingTotal")
.textContent =
new Intl.NumberFormat(
"id-ID",
{
style:"currency",
currency:"IDR",
maximumFractionDigits:0
}
).format(
Transaction.total("saving")
);



document.getElementById("savingCount")
.textContent =
data.length;



if(data.length===0){

savingList.innerHTML =
"<p>Belum ada tabungan.</p>";

return;

}



savingList.innerHTML =
data.map(item=>`

<div class="transaction-item">


<div>

<strong>
${item.title}
</strong>

</div>


<strong>
Rp${Number(item.amount)
.toLocaleString("id-ID")}
</strong>


</div>


`).join("");

}



savingForm.addEventListener(
"submit",
(e)=>{


e.preventDefault();


Transaction.add({

title:savingName.value,

amount:Number(
savingAmount.value
),

type:"saving",

category:"Tabungan"


});


savingForm.reset();

renderSaving();


});



renderSaving();


</script>


</body>

</html>
