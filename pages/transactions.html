<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transactions - Savora</title>

<link rel="icon" href="../assets/svg/favicon.svg">

<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">

</head>


<body>


<div class="dashboard">


<aside class="sidebar">


<div class="sidebar-logo">

<img src="../assets/svg/logo.svg">

<span class="sidebar-title">
Savora
</span>

</div>


<nav class="sidebar-menu">


<a href="dashboard.html"
class="sidebar-link">

<img src="../assets/svg/wallet.svg" width="24">

<span>Dashboard</span>

</a>


<a class="sidebar-link active">

<img src="../assets/svg/income.svg" width="24">

<span>Transaksi</span>

</a>


<a href="savings.html"
class="sidebar-link">

<img src="../assets/svg/saving.svg" width="24">

<span>Tabungan</span>

</a>


<a href="analytics.html"
class="sidebar-link">

<img src="../assets/svg/analytics.svg" width="24">

<span>Analitik</span>

</a>


</nav>


</aside>





<main class="main">


<header class="topbar">

<h1>
Transaksi
</h1>


<button 
class="btn btn-outline"
onclick="Theme.toggle()">

🌙

</button>


</header>





<!-- FORM -->

<section class="card">


<h2>
Tambah Transaksi
</h2>


<form id="transactionForm"
class="auth-form">


<div class="form-group">

<label class="form-label">
Judul
</label>

<input
id="title"
class="input"
placeholder="Contoh: Gaji, Makan, Belanja"
required>

</div>



<div class="form-group">

<label class="form-label">
Jumlah
</label>

<input
id="amount"
type="number"
class="input"
placeholder="10000"
required>

</div>



<div class="form-group">

<label class="form-label">
Jenis
</label>


<select id="type"
class="input">


<option value="income">
Pemasukan
</option>


<option value="expense">
Pengeluaran
</option>


<option value="saving">
Tabungan
</option>


</select>


</div>



<div class="form-group">

<label class="form-label">
Kategori
</label>


<input
id="category"
class="input"
placeholder="Makanan">

</div>



<button class="btn btn-primary">

Tambah

</button>


</form>


</section>





<!-- LIST -->


<section class="card"
style="margin-top:24px">


<h2>
Riwayat Transaksi
</h2>


<div id="transactionList"
class="transaction-list">

</div>


</section>




</main>


</div>





<script src="../assets/js/storage.js"></script>

<script src="../assets/js/theme.js"></script>

<script src="../assets/js/transaction.js"></script>


<script>


const form =
document.getElementById("transactionForm");


const list =
document.getElementById("transactionList");



function renderTransactions(){


const data =
Transaction.all();



if(data.length === 0){

list.innerHTML =
"<p>Belum ada transaksi.</p>";

return;

}



list.innerHTML =
data.map(item => `


<div class="transaction-item">


<div>

<strong>
${item.title}
</strong>

<p>
${item.category}
</p>

</div>



<div>

<strong>
Rp${Number(item.amount).toLocaleString("id-ID")}
</strong>


<br>


<button 
class="btn btn-danger btn-sm"
onclick="removeTransaction(${item.id})">

Hapus

</button>


</div>


</div>


`).join("");

}



form.addEventListener("submit",(e)=>{


e.preventDefault();


Transaction.add({

title:title.value,

amount:Number(amount.value),

type:type.value,

category:category.value

});


form.reset();

renderTransactions();


});



function removeTransaction(id){

Transaction.delete(id);

renderTransactions();

}



renderTransactions();


</script>


</body>

</html>
