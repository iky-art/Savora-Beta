<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Lupa Password • Savora</title>

    <link
        rel="icon"
        href="../assets/svg/favicon.svg">

    <link
        rel="stylesheet"
        href="../assets/css/variables.css">

    <link
        rel="stylesheet"
        href="../assets/css/components.css">

    <link
        rel="stylesheet"
        href="../assets/css/auth.css">

</head>

<body class="auth">

    <div class="auth-card">

        <!-- Header -->

        <div class="auth-header">

            <img
                src="../assets/svg/logo.svg"
                alt="Savora"
                class="auth-logo">

            <h1>Lupa Password?</h1>

            <p>

                Masukkan email akunmu.
                Kami akan mengirimkan
                instruksi untuk mengatur
                ulang password.

            </p>

        </div>

        <!-- Form -->

        <form
            class="auth-form"
            action="#"
            method="post">

            <div class="form-group">

                <label for="email">

                    Email

                </label>

                <input
                    type="email"
                    id="email"
                    class="form-input"
                    placeholder="nama@email.com"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100">

                Kirim Link Reset

            </button>

        </form>

        <div class="auth-divider">

            <span>atau</span>

        </div>

        <div class="auth-footer">

            <a href="login.html">

                ← Kembali ke Login

            </a>

        </div>

    </div>

</body>

</html>
